# cargo-deny configuration: supply-chain policy for Unseenkey.
# Every new dependency needs a one-line justification in the PR (docs/10).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
  # File-level copyleft only; used by `option-ext` via `dirs`. Does not affect our licence.
  "MPL-2.0",
  # Permissive data licence for the Mozilla root-certificate store
  # (`webpki-root-certs`, pulled in by `rustls-platform-verifier`).
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Our own crypto is RustCrypto only. `ring` is allowed solely as the rustls TLS
# provider for outbound upstream connections; OpenSSL is never allowed.
deny = [
  { name = "openssl" },
  { name = "openssl-sys" },
  { name = "native-tls" },
  { name = "rustc-serialize" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
