# cargo-deny configuration: supply-chain policy for Unseenkey.
# Every new dependency needs a one-line justification in the PR (docs/10).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Exactly one implementation of each primitive; no duplicate crypto crates.
deny = [
  { name = "openssl" },
  { name = "openssl-sys" },
  { name = "ring", wrappers = [] },
  { name = "rustc-serialize" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
