[package]
name = "unseenkey-desktop"
version = "0.1.1"
description = "Unseenkey desktop: vault, handles, approvals and audit for people who own the keys."
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ureq = { version = "2", default-features = false, features = ["json"] }
unseenkey-core = { path = "../../../crates/core" }
unseenkey-daemon = { path = "../../../crates/daemon" }
usk = { path = "../../../crates/usk" }

# Windows Hello (KeyCredentialManager) for device unlock; see `hello.rs`.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Security_Credentials",
  "Security_Cryptography",
  "Storage_Streams",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
