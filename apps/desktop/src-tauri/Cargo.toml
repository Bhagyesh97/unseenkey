[package]
name = "unseenkey-desktop"
version = "0.1.0"
description = "Unseenkey desktop: vault, handles, approvals and audit for people who own the keys."
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json"] }
unseenkey-core = { path = "../../../crates/core" }
unseenkey-daemon = { path = "../../../crates/daemon" }
usk = { path = "../../../crates/usk" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
