<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59636e"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/>
    </marker>
  </defs>

  <!-- left: the caller -->
  <rect x="30" y="70" width="300" height="250" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="180" y="105" text-anchor="middle" font-weight="600" font-size="17" fill="#1f2328">Your SDK, agent or contractor</text>
  <text x="180" y="130" text-anchor="middle" fill="#59636e">holds only a handle</text>
  <rect x="55" y="155" width="250" height="34" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/>
  <text x="180" y="177" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#0969da">ANTHROPIC_API_KEY=usk_h_7Qx…</text>
  <text x="180" y="222" text-anchor="middle" fill="#59636e">useless in a chat, a repo, a log,</text>
  <text x="180" y="244" text-anchor="middle" fill="#59636e">or on anyone else's machine</text>
  <text x="180" y="290" text-anchor="middle" fill="#59636e" font-size="13">Claude Code · Cursor · boto3 · curl · a hired developer</text>

  <!-- middle: the broker -->
  <rect x="420" y="40" width="360" height="310" rx="12" fill="#f6f8fa" stroke="#0969da" stroke-width="2"/>
  <text x="600" y="75" text-anchor="middle" font-weight="600" font-size="17" fill="#1f2328">Unseenkey broker</text>
  <text x="600" y="98" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#59636e">127.0.0.1 only · vault encrypted at rest</text>
  <g fill="#1f2328">
    <text x="450" y="140">1  handle → secret, decrypted per request</text>
    <text x="450" y="170">2  policy: host · path · rate · expiry · approval</text>
    <text x="450" y="200">3  audit entry before the first byte leaves</text>
    <text x="450" y="230">4  real key injected into the outgoing request</text>
    <text x="450" y="260">5  response scrubbed of the real key</text>
  </g>
  <rect x="450" y="285" width="300" height="34" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/>
  <text x="600" y="307" text-anchor="middle" font-size="14" fill="#1a7f37">refused → nothing is sent, and it is logged</text>

  <!-- right: the provider -->
  <rect x="870" y="70" width="300" height="250" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="1020" y="105" text-anchor="middle" font-weight="600" font-size="17" fill="#1f2328">The provider</text>
  <text x="1020" y="130" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#59636e">api.anthropic.com</text>
  <text x="1020" y="175" text-anchor="middle" fill="#59636e">sees a normal request</text>
  <text x="1020" y="197" text-anchor="middle" fill="#59636e">with the real key</text>
  <text x="1020" y="245" text-anchor="middle" fill="#59636e" font-size="13">Anthropic · OpenAI · Stripe · AWS · GitHub</text>
  <text x="1020" y="266" text-anchor="middle" fill="#59636e" font-size="13">Google · Slack · 18 presets + any host</text>

  <!-- arrows: request -->
  <line x1="332" y1="150" x2="416" y2="150" stroke="#0969da" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="374" y="140" text-anchor="middle" font-size="12" fill="#0969da">handle</text>
  <line x1="782" y1="150" x2="866" y2="150" stroke="#0969da" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="824" y="140" text-anchor="middle" font-size="12" fill="#0969da">real key</text>

  <!-- arrows: response -->
  <line x1="866" y1="240" x2="782" y2="240" stroke="#59636e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="824" y="262" text-anchor="middle" font-size="12" fill="#59636e">response</text>
  <line x1="416" y1="240" x2="332" y2="240" stroke="#59636e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="374" y="262" text-anchor="middle" font-size="12" fill="#59636e">scrubbed</text>

  <!-- footer -->
  <text x="600" y="385" text-anchor="middle" font-size="13" fill="#59636e">The key never leaves the vault except inside a request the policy allowed. Every call is in a hash-chained log.</text>
</svg>
