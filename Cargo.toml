[workspace]
resolver = "2"
members = ["crates/core", "crates/daemon", "crates/usk"]
# The desktop app has its own lockfile and a much larger dependency tree (webkit/GTK on
# Linux); it is built separately so `cargo build --workspace` stays lean.
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Bhagyesh97/unseenkey"
rust-version = "1.85"

[workspace.dependencies]
# crypto (RustCrypto + friends); versions pinned to a mutually compatible set
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hkdf = "0.12"
sha2 = { version = "0.10", default-features = false }
blake3 = "1"
ed25519-dalek = { version = "2", default-features = false, features = ["alloc", "zeroize"] }
rand_core = { version = "0.6", features = ["getrandom"] }
subtle = { version = "2", default-features = false }
zeroize = { version = "1", features = ["zeroize_derive", "serde"] }
bip39 = { version = "3", default-features = false, features = ["alloc"] }

# storage
rusqlite = { version = "0.40", features = ["bundled"] }

# daemon
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "matched-path", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# general
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

# cli
clap = { version = "4", features = ["derive", "env"] }
rpassword = "7"
dirs = "7"
# Loopback only: no TLS feature, so no second crypto stack (rustls/ring) in the tree.
ureq = { version = "2", default-features = false, features = ["json"] }

# broker: scrubbing and encodings
aho-corasick = "1"
base64 = "0.22"
percent-encoding = "2"

# time zones for policy schedules (bundled tzdb so behaviour is identical on every OS)
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }

# dev
tempfile = "3"
proptest = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
