name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # Sigstore keyless signing

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # The tag must match the versions we ship: v0.1.0 or v0.1.0-rc.1 need
    # workspace, desktop and Claude Code plugin versions of 0.1.0. Catches a
    # forgotten bump before any expensive build starts.
    name: tag matches versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          core="${tag%%-*}"
          ws=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          app=$(python3 -c "import json; print(json.load(open('apps/desktop/src-tauri/tauri.conf.json'))['version'])")
          plugin=$(python3 -c "import json; print(json.load(open('plugins/unseenkey/.claude-plugin/plugin.json'))['version'])")
          echo "tag=$tag core=$core workspace=$ws desktop=$app plugin=$plugin"
          [ "$core" = "$ws" ] && [ "$core" = "$app" ] && [ "$core" = "$plugin" ] || { echo "::error::tag $tag does not match workspace $ws / desktop $app / plugin $plugin"; exit 1; }

  build:
    name: build (${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          # Hosted arm64 runners are free only on public repos; cross-compile
          # from x86_64 instead so the pipeline works on a private repo too.
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          # No hosted Intel Mac runners any more: build x86_64 on the arm64 runner.
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
        if: matrix.cross
        with:
          tool: cross
      - run: ${{ matrix.cross && 'cross' || 'cargo' }} build --release --locked -p usk --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          name="usk-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            cp "target/${{ matrix.target }}/release/usk.exe" "target/${{ matrix.target }}/release/uskd.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/usk" "target/${{ matrix.target }}/release/uskd" "dist/$name/"
          fi
          cp README.md LICENSE-APACHE SECURITY.md "dist/$name/" 2>/dev/null || cp README.md SECURITY.md "dist/$name/"
          cd dist
          if [[ "${{ matrix.archive }}" == zip ]]; then
            7z a -tzip "$name.zip" "$name" >/dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
          ls -la
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    name: sign and publish
    needs: build
    runs-on: ubuntu-latest
    outputs:
      # The draft's id, so the desktop jobs attach to it by id instead of
      # looking it up by tag (a lookup that raced and failed twice on 0.1.1).
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      # The SBOM is generated from the source tree (Cargo.lock, package-lock.json),
      # not from the archives: syft cannot see inside a tarball of binaries and
      # produced an empty document on the first run.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
      - name: sign (keyless, Sigstore)
        run: |
          cd dist
          for f in *.tar.gz *.zip SHA256SUMS; do
            cosign sign-blob --yes --output-signature "$f.sig" --output-certificate "$f.pem" "$f"
          done
          ls -la
      - name: SBOM (from Cargo.lock and package-lock.json)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/sbom.cdx.json
          upload-artifact: false
      - name: SBOM sanity
        run: |
          n=$(python3 -c "import json; print(len(json.load(open('dist/sbom.cdx.json')).get('components', [])))")
          echo "sbom components: $n"
          [ "$n" -gt 50 ] || { echo "::error::SBOM has only $n components"; exit 1; }
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        id: draft
        with:
          files: dist/*
          generate_release_notes: true
          draft: true
          # v0.1.0-alpha.1, v1.2.0-rc.1: pre-release. v1.2.0: release.
          prerelease: ${{ contains(github.ref_name, '-') }}

  desktop:
    # Desktop installers, built after the CLI release exists so tauri-action
    # attaches to the same draft. Updater bundles are signed with the minisign
    # key in TAURI_SIGNING_PRIVATE_KEY; latest.json is merged across platforms.
    name: desktop (${{ matrix.os }} ${{ matrix.args }})
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
          - os: macos-latest
            args: "--target x86_64-apple-darwin"
          - os: ubuntu-22.04
            args: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
        working-directory: apps/desktop
      - name: Apple signing and notarization (only when the secrets exist)
        if: runner.os == 'macOS'
        env:
          HAS_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' }}
        run: |
          [ "$HAS_APPLE" = "true" ] || { echo "no Apple signing secrets; building unsigned"; exit 0; }
          {
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"
      - name: Windows Authenticode (only when the secrets exist)
        if: runner.os == 'Windows'
        env:
          HAS_WIN: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
        shell: bash
        run: |
          [ "$HAS_WIN" = "true" ] || { echo "no Windows signing secrets; building unsigned"; exit 0; }
          echo "${{ secrets.WINDOWS_CERTIFICATE }}" | base64 -d > "$RUNNER_TEMP/cert.pfx"
          echo "TAURI_WINDOWS_SIGN_PFX=$RUNNER_TEMP/cert.pfx" >> "$GITHUB_ENV"
          echo "TAURI_WINDOWS_SIGN_PFX_PASSWORD=${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}" >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseId: ${{ needs.release.outputs.release_id }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  notes:
    # The handwritten section of CHANGELOG.md for this version, followed by
    # GitHub's generated list of changes. Runs last so neither the CLI nor the
    # desktop step can overwrite it. The draft stays a draft: publishing is a
    # human decision after the installers were tried.
    name: release notes
    needs: [release, desktop]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Lines from "## <version>" up to the next "## " heading.
          awk -v v="$version" '
            /^## / { on = index($0, "## " v) == 1 }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::no CHANGELOG.md section for $version; using generated notes only"
          fi
          {
            echo
            echo "## Changes"
            echo
            gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="${GITHUB_REF_NAME}" -q .body               | sed -E '/^## What.s Changed/d'
          } >> notes.md
          gh release edit "${GITHUB_REF_NAME}" --notes-file notes.md
