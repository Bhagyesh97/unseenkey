name: release

on:
  push:
    tags: ["v*"]

# Read-only unless a job says otherwise. The build jobs run build scripts and
# proc macros from the whole dependency tree; they get a token that cannot
# write to the repository or ask Sigstore for a certificate. Only the jobs that
# publish ask for more, each for what it needs.
#
# No caches anywhere in this workflow: a cache is written by other runs, and
# what ships must come from the tagged commit and the lockfiles alone.
#
# Every action is pinned to a commit (its tag is in the comment), and no
# checkout leaves its token behind in `.git/config`.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Two things, before any expensive build starts.
    #
    # The tag must match the versions we ship: v0.1.0 or v0.1.0-rc.1 need
    # workspace, desktop and Claude Code plugin versions of 0.1.0. Catches a
    # forgotten bump.
    #
    # The tagged commit must be on main. A tag can be pushed from any branch,
    # reviewed or not; a release is built only from what main holds.
    name: tag matches versions and is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          core="${tag%%-*}"
          ws=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          app=$(python3 -c "import json; print(json.load(open('apps/desktop/src-tauri/tauri.conf.json'))['version'])")
          plugin=$(python3 -c "import json; print(json.load(open('plugins/unseenkey/.claude-plugin/plugin.json'))['version'])")
          echo "tag=$tag core=$core workspace=$ws desktop=$app plugin=$plugin"
          [ "$core" = "$ws" ] && [ "$core" = "$app" ] && [ "$core" = "$plugin" ] || { echo "::error::tag $tag does not match workspace $ws / desktop $app / plugin $plugin"; exit 1; }
      - shell: bash
        run: |
          set -euo pipefail
          commit=$(git rev-parse 'HEAD^{commit}')
          git merge-base --is-ancestor "$commit" origin/main || { echo "::error::${GITHUB_REF_NAME} ($commit) is not on main; merge it first, then tag the commit on main"; exit 1; }
          echo "$commit is on main"

  build:
    name: build (${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          # Hosted arm64 runners are free only on public repos; cross-compile
          # from x86_64 instead so the pipeline works on a private repo too.
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          # No hosted Intel Mac runners any more: build x86_64 on the arm64 runner.
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        if: matrix.cross
        with:
          tool: cross
      - run: ${{ matrix.cross && 'cross' || 'cargo' }} build --release --locked -p usk --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          name="usk-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            cp "target/${{ matrix.target }}/release/usk.exe" "target/${{ matrix.target }}/release/uskd.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/usk" "target/${{ matrix.target }}/release/uskd" "dist/$name/"
          fi
          cp README.md LICENSE-APACHE SECURITY.md "dist/$name/" 2>/dev/null || cp README.md SECURITY.md "dist/$name/"
          cd dist
          if [[ "${{ matrix.archive }}" == zip ]]; then
            7z a -tzip "$name.zip" "$name" >/dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
          ls -la
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/*

  mcpb:
    # The MCP bundle for Claude Desktop and the MCP registry: `usk` for macOS
    # (one universal binary from the two Mac builds) and Windows, plus the
    # registry's `server.json` with the bundle's URL and SHA-256.
    name: MCP bundle
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: cli
          merge-multiple: true
      - shell: bash
        run: |
          set -euo pipefail
          cd cli
          for f in *-apple-darwin.tar.gz; do tar xzf "$f"; done
          unzip -q "usk-${GITHUB_REF_NAME}-x86_64-pc-windows-msvc.zip"
          lipo -create "usk-${GITHUB_REF_NAME}-aarch64-apple-darwin/usk" "usk-${GITHUB_REF_NAME}-x86_64-apple-darwin/usk" -output usk-universal
          lipo -info usk-universal
          cd ..
          python3 packaging/mcpb/build.py --version "${GITHUB_REF_NAME#v}"             --darwin cli/usk-universal             --windows "cli/usk-${GITHUB_REF_NAME}-x86_64-pc-windows-msvc/usk.exe"             --out mcpb
          ls -la mcpb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcpb
          path: mcpb/*

  release:
    name: sign and publish
    needs: [build, mcpb]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
      id-token: write # Sigstore keyless signing
    outputs:
      # The draft's id, so the later jobs attach to it by id instead of
      # looking it up by tag (a lookup that raced and failed twice on 0.1.1).
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      # The SBOM is generated from the source tree (Cargo.lock, package-lock.json),
      # not from the archives: syft cannot see inside a tarball of binaries and
      # produced an empty document on the first run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      # SHA256SUMS is not made here: the `checksums` job writes it at the end,
      # over these files and the desktop installers together.
      - name: sign (keyless, Sigstore)
        run: |
          cd dist
          for f in *.tar.gz *.zip *.mcpb; do
            cosign sign-blob --yes --output-signature "$f.sig" --output-certificate "$f.pem" "$f"
          done
          ls -la
      - name: SBOM (from Cargo.lock and package-lock.json)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/sbom.cdx.json
          upload-artifact: false
      - name: SBOM sanity
        run: |
          n=$(python3 -c "import json; print(len(json.load(open('dist/sbom.cdx.json')).get('components', [])))")
          echo "sbom components: $n"
          [ "$n" -gt 50 ] || { echo "::error::SBOM has only $n components"; exit 1; }
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        id: draft
        with:
          files: dist/*
          generate_release_notes: true
          draft: true
          # v0.1.0-alpha.1, v1.2.0-rc.1: pre-release. v1.2.0: release.
          prerelease: ${{ contains(github.ref_name, '-') }}

  desktop:
    # Desktop installers, built after the CLI release exists so tauri-action
    # attaches to the same draft. Updater bundles are signed with the minisign
    # key in TAURI_SIGNING_PRIVATE_KEY; latest.json is merged across platforms.
    #
    # This job holds the updater's signing key, so it runs in the `release`
    # environment. GitHub makes that environment on first use, with no rules.
    # Moving the signing secrets from the repository into it, and adding
    # yourself as a required reviewer there, means no other workflow or branch
    # can read them and nothing is signed until you approve the run.
    name: desktop (${{ matrix.os }} ${{ matrix.args }})
    needs: release
    runs-on: ${{ matrix.os }}
    environment: release
    permissions:
      contents: write # attach the installers to the draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
          - os: macos-latest
            args: "--target x86_64-apple-darwin"
          - os: ubuntu-22.04
            args: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: npm ci
        working-directory: apps/desktop
      # The app has its own lockfile. The build below goes through the Tauri
      # CLI, so the lockfile is checked here instead: this fails if Cargo.lock
      # does not already describe every dependency, and the build after it then
      # has nothing to resolve.
      - name: the lockfile is complete
        run: cargo fetch --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Apple signing and notarization (only when the secrets exist)
        if: runner.os == 'macOS'
        env:
          HAS_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' }}
        run: |
          [ "$HAS_APPLE" = "true" ] || { echo "no Apple signing secrets; building unsigned"; exit 0; }
          {
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"
      - name: Windows Authenticode (only when the secrets exist)
        if: runner.os == 'Windows'
        env:
          HAS_WIN: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
        shell: bash
        run: |
          [ "$HAS_WIN" = "true" ] || { echo "no Windows signing secrets; building unsigned"; exit 0; }
          echo "${{ secrets.WINDOWS_CERTIFICATE }}" | base64 -d > "$RUNNER_TEMP/cert.pfx"
          echo "TAURI_WINDOWS_SIGN_PFX=$RUNNER_TEMP/cert.pfx" >> "$GITHUB_ENV"
          echo "TAURI_WINDOWS_SIGN_PFX_PASSWORD=${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}" >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseId: ${{ needs.release.outputs.release_id }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  checksums:
    # One SHA256SUMS over every file on the draft, written last and signed.
    #
    # The desktop jobs can write to the release, and they run the largest
    # dependency tree we have. So before anything is listed, each CLI archive
    # and the MCP bundle is checked against the Sigstore signature the
    # `release` job made for it: the desktop jobs cannot ask Sigstore for a
    # certificate in this workflow's name, so a file changed after signing
    # fails here. The installers have no such earlier signature; their line in
    # SHA256SUMS says what this run built, and the updater checks its own
    # (minisign) signature on them.
    name: checksums over every file
    needs: [release, desktop]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach SHA256SUMS to the draft
      id-token: write # Sigstore keyless signing
    steps:
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: download every file on the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}/releases"
          mkdir files signatures
          gh api --paginate "$api/${RELEASE_ID}/assets?per_page=100" -q '.[] | [.id, .name] | @tsv' > assets.tsv
          while IFS=$'\t' read -r id name; do
            case "$name" in
              # An earlier attempt's list: replaced below.
              SHA256SUMS | SHA256SUMS.sig | SHA256SUMS.pem)
                gh api -X DELETE "$api/assets/$id" < /dev/null
                ;;
              *.sig | *.pem)
                gh api -H "Accept: application/octet-stream" "$api/assets/$id" < /dev/null > "signatures/$name"
                ;;
              *)
                gh api -H "Accept: application/octet-stream" "$api/assets/$id" < /dev/null > "files/$name"
                ;;
            esac
          done < assets.tsv
          ls -la files
      - name: the signed files are still the ones that were signed
        shell: bash
        run: |
          set -euo pipefail
          checked=0
          for pem in signatures/*.pem; do
            name=$(basename "$pem" .pem)
            cosign verify-blob \
              --certificate "$pem" \
              --signature "signatures/$name.sig" \
              --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "files/$name"
            checked=$((checked + 1))
          done
          echo "checked $checked signatures"
          # Five CLI archives and the MCP bundle.
          [ "$checked" -ge 6 ] || { echo "::error::only $checked signed files on the draft"; exit 1; }
      - name: SHA256SUMS, signed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
        run: |
          set -euo pipefail
          (cd files && sha256sum -- * > ../SHA256SUMS)
          cat SHA256SUMS
          cosign sign-blob --yes --output-signature SHA256SUMS.sig --output-certificate SHA256SUMS.pem SHA256SUMS
          for f in SHA256SUMS SHA256SUMS.sig SHA256SUMS.pem; do
            curl --fail-with-body --silent --show-error -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=$f" > /dev/null
          done

  notes:
    # The handwritten section of CHANGELOG.md for this version, followed by
    # GitHub's generated list of changes. Runs last so neither the CLI nor the
    # desktop step can overwrite it. The draft stays a draft: publishing is a
    # human decision after the installers were tried.
    name: release notes
    needs: [release, desktop, checksums]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # edit the draft's notes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Lines from "## <version>" up to the next "## " heading.
          awk -v v="$version" '
            /^## / { on = index($0, "## " v) == 1 }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::no CHANGELOG.md section for $version; using generated notes only"
          fi
          {
            echo
            echo "## Changes"
            echo
            gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="${GITHUB_REF_NAME}" -q .body               | sed -E '/^## What.s Changed/d'
          } >> notes.md
          gh release edit "${GITHUB_REF_NAME}" --notes-file notes.md
