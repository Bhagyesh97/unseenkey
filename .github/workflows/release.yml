name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # Sigstore keyless signing

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # The tag must match the versions we ship: v0.1.0 or v0.1.0-rc.1 need
    # workspace and desktop versions of 0.1.0. Catches a forgotten bump before
    # any expensive build starts.
    name: tag matches versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          core="${tag%%-*}"
          ws=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          app=$(python3 -c "import json; print(json.load(open('apps/desktop/src-tauri/tauri.conf.json'))['version'])")
          echo "tag=$tag core=$core workspace=$ws desktop=$app"
          [ "$core" = "$ws" ] && [ "$core" = "$app" ] || { echo "::error::tag $tag does not match workspace $ws / desktop $app"; exit 1; }

  build:
    name: build (${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          # Hosted arm64 runners are free only on public repos; cross-compile
          # from x86_64 instead so the pipeline works on a private repo too.
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          # No hosted Intel Mac runners any more: build x86_64 on the arm64 runner.
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        if: matrix.cross
        with:
          tool: cross
      - run: ${{ matrix.cross && 'cross' || 'cargo' }} build --release --locked -p usk --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          name="usk-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            cp "target/${{ matrix.target }}/release/usk.exe" "target/${{ matrix.target }}/release/uskd.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/usk" "target/${{ matrix.target }}/release/uskd" "dist/$name/"
          fi
          cp README.md LICENSE-APACHE SECURITY.md "dist/$name/" 2>/dev/null || cp README.md SECURITY.md "dist/$name/"
          cd dist
          if [[ "${{ matrix.archive }}" == zip ]]; then
            7z a -tzip "$name.zip" "$name" >/dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    name: sign and publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The SBOM is generated from the source tree (Cargo.lock, package-lock.json),
      # not from the archives: syft cannot see inside a tarball of binaries and
      # produced an empty document on the first run.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: sigstore/cosign-installer@v3
      - name: sign (keyless, Sigstore)
        run: |
          cd dist
          for f in *.tar.gz *.zip SHA256SUMS; do
            cosign sign-blob --yes --output-signature "$f.sig" --output-certificate "$f.pem" "$f"
          done
          ls -la
      - name: SBOM (from Cargo.lock and package-lock.json)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/sbom.cdx.json
          upload-artifact: false
      - name: SBOM sanity
        run: |
          n=$(python3 -c "import json; print(len(json.load(open('dist/sbom.cdx.json')).get('components', [])))")
          echo "sbom components: $n"
          [ "$n" -gt 50 ] || { echo "::error::SBOM has only $n components"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: true
          # v0.1.0-alpha.1, v1.2.0-rc.1: pre-release. v1.2.0: release.
          prerelease: ${{ contains(github.ref_name, '-') }}

  desktop:
    # Desktop installers, built after the CLI release exists so tauri-action
    # attaches to the same draft. Updater bundles are signed with the minisign
    # key in TAURI_SIGNING_PRIVATE_KEY; latest.json is merged across platforms.
    name: desktop (${{ matrix.os }} ${{ matrix.args }})
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
          - os: macos-latest
            args: "--target x86_64-apple-darwin"
          - os: ubuntu-22.04
            args: ""
    steps:
      - uses: actions/checkout@v4
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
        working-directory: apps/desktop
      - name: Apple signing and notarization (only when the secrets exist)
        if: runner.os == 'macOS'
        env:
          HAS_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' }}
        run: |
          [ "$HAS_APPLE" = "true" ] || { echo "no Apple signing secrets; building unsigned"; exit 0; }
          {
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"
      - name: Windows Authenticode (only when the secrets exist)
        if: runner.os == 'Windows'
        env:
          HAS_WIN: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
        shell: bash
        run: |
          [ "$HAS_WIN" = "true" ] || { echo "no Windows signing secrets; building unsigned"; exit 0; }
          echo "${{ secrets.WINDOWS_CERTIFICATE }}" | base64 -d > "$RUNNER_TEMP/cert.pfx"
          echo "TAURI_WINDOWS_SIGN_PFX=$RUNNER_TEMP/cert.pfx" >> "$GITHUB_ENV"
          echo "TAURI_WINDOWS_SIGN_PFX_PASSWORD=${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}" >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}
