name: desktop

# The desktop app lives outside the Cargo workspace (its own lockfile, Tauri's
# dependency tree). Build it on every platform we ship, without bundling, so a
# broken command or a UI type error fails fast.

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "crates/**"
      - ".github/workflows/desktop.yml"
  # No path filter on pull requests: `main` requires these checks by name, and
  # a check that never starts would leave an unrelated pull request waiting forever.
  pull_request:

# Every action is pinned to a commit (its tag is in the comment), so a moved
# tag cannot change what runs here. Cargo runs with --locked: the app's own
# Cargo.lock must already describe the build, as the release requires.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux system libraries (webkit2gtk, tray)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo build --manifest-path src-tauri/Cargo.toml --locked
