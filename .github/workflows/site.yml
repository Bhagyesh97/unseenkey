name: site

# Deploys unseenkey.com to Cloudflare Pages when the site changes. Needs two
# repository secrets: CLOUDFLARE_API_TOKEN (a token with only "Cloudflare
# Pages: Edit" on the account) and CLOUDFLARE_ACCOUNT_ID. Until they exist the
# job explains itself and exits green, so the rest of CI is not held hostage.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - id: secrets
        shell: bash
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; skipping the deploy"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'
      # Wrangler from the site's own lockfile, not cloudflare/wrangler-action:
      # the repository only allows GitHub's and a short list of vetted actions,
      # and a third-party action made this workflow fail before it started.
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 22
      - name: deploy
        if: steps.secrets.outputs.ok == 'true'
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci --ignore-scripts
          npx --no-install wrangler pages deploy public --project-name unseenkey --branch main --commit-dirty=true
