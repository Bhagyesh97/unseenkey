[package]
name = "usk"
description = "Unseenkey CLI: store secrets, use them without seeing them."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# `cargo run -p usk` runs the CLI; the daemon is `usk daemon run` or the `uskd` bin.
default-run = "usk"

[[bin]]
name = "usk"
path = "src/main.rs"

[[bin]]
name = "uskd"
path = "src/bin/uskd.rs"

[dependencies]
unseenkey-core = { version = "0.1.0", path = "../core" }
unseenkey-daemon = { version = "0.1.0", path = "../daemon" }
clap = { workspace = true }
rpassword = { workspace = true }
dirs = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
zeroize = { workspace = true }
ureq = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
tempfile = { workspace = true }
