id = "openrouter"
display = "OpenRouter"
upstreams = ["openrouter.ai"]
auth = { kind = "bearer" }
docs = "https://openrouter.ai/settings/keys"
base_path = "/api/v1"
category = "ai"
key_prefixes = ["sk-or-"]

[env]
base_url = "OPENROUTER_BASE_URL"
api_key = "OPENROUTER_API_KEY"


[verify]
method = "GET"
path = "/api/v1/key"

[[policies]]
id = "chat"
display = "Chat, responses and embeddings only"
recommended = true
allow = [
  "POST /api/v1/chat/completions",
  "POST /api/v1/completions",
  "GET /api/v1/models",
  "GET /api/v1/models/**",
]

[[policies]]
id = "no-admin"
display = "Everything except organisation, billing and fine-tuning"
allow = ["* /**"]
deny = [
  "* /api/v1/keys/**",
  "* /api/v1/credits/**",
]

[[policies]]
id = "full"
display = "Full access (not recommended for delegation)"
allow = ["* /**"]

# Key-shaped handles for tools that check the key format (opt-in, D-26).

[[handle_formats]]
when = "sk-or-"
format = "sk-or-v1-usk{40}"
