id = "anthropic"
display = "Anthropic"
upstreams = ["api.anthropic.com"]
auth = { kind = "header", name = "x-api-key" }
docs = "https://console.anthropic.com/settings/keys"
base_path = ""
category = "ai"
key_prefixes = ["sk-ant-"]

[env]
base_url = "ANTHROPIC_BASE_URL"
api_key = "ANTHROPIC_API_KEY"
# Used instead of api_key when the stored secret is an OAuth bearer token
# (Claude Code: `claude setup-token`).
oauth_token = "CLAUDE_CODE_OAUTH_TOKEN"


[verify]
method = "GET"
path = "/v1/models"
headers = { "anthropic-version" = "2023-06-01" }

[[policies]]
id = "chat"
display = "Chat, responses and embeddings only"
recommended = true
allow = [
  "POST /v1/messages",
  "POST /v1/messages/count_tokens",
  "GET /v1/models",
  "GET /v1/models/*",
]

[[policies]]
id = "no-admin"
display = "Everything except organisation, billing and fine-tuning"
allow = ["* /**"]
deny = [
  "* /v1/organizations/**",
  "* /v1/messages/batches/**",
  "* /v1/files/**",
]

[[policies]]
id = "full"
display = "Full access (not recommended for delegation)"
allow = ["* /**"]

# Key-shaped handles for tools that check the key format (opt-in, D-26).

[[handle_formats]]
when = "sk-ant-oat01-"
format = "sk-ant-oat01-usk-{40}"

[[handle_formats]]
when = "sk-ant-api03-"
format = "sk-ant-api03-usk-{40}"

[[handle_formats]]
format = "sk-ant-usk-{40}"
