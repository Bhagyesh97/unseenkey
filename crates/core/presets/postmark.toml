id = "postmark"
display = "Postmark"
category = "email"
upstreams = ["api.postmarkapp.com"]
auth = { kind = "header", name = "X-Postmark-Server-Token" }
docs = "https://account.postmarkapp.com/servers"
base_path = ""
key_prefixes = []
env_names = ["POSTMARK_API_TOKEN"]

[env]
api_key = "POSTMARK_SERVER_TOKEN"

[verify]
method = "GET"
path = "/server"
headers = { "Accept" = "application/json" }

[[policies]]
id = "standard"
display = "Everything except deletes and account, key and billing changes"
recommended = true
allow = ["* /**"]
deny = ["DELETE /**", "* /server/**", "PUT /server", "* /servers/**", "* /domains/**", "* /senders/**"]

[[policies]]
id = "read-only"
display = "Read only"
allow = ["GET /**"]

[[policies]]
id = "full"
display = "Full access (not recommended for delegation)"
allow = ["* /**"]
