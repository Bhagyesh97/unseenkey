id = "render"
display = "Render"
category = "hosting"
upstreams = ["api.render.com"]
auth = { kind = "bearer" }
docs = "https://dashboard.render.com/u/settings#api-keys"
base_path = "/v1"
key_prefixes = []
env_names = []

[env]
api_key = "RENDER_API_KEY"

[verify]
method = "GET"
path = "/v1/owners?limit=1"

[[policies]]
id = "standard"
display = "Everything except deletes and account, key and billing changes"
recommended = true
allow = ["* /**"]
deny = ["DELETE /**", "* /v1/services/*/env-vars", "* /v1/services/*/env-vars/**", "* /v1/env-groups", "* /v1/env-groups/**", "* /v1/services/*/suspend", "* /v1/services/*/suspend/**", "POST /v1/services", "POST /v1/services/**"]

[[policies]]
id = "read-only"
display = "Read only"
allow = ["GET /**"]

[[policies]]
id = "full"
display = "Full access (not recommended for delegation)"
allow = ["* /**"]
