id = "elevenlabs"
display = "ElevenLabs"
category = "ai"
upstreams = ["api.elevenlabs.io", "api.us.elevenlabs.io", "api.eu.residency.elevenlabs.io", "api.in.residency.elevenlabs.io"]
auth = { kind = "header", name = "xi-api-key" }
docs = "https://elevenlabs.io/app/settings/api-keys"
base_path = "/v1"
key_prefixes = []
env_names = ["ELEVEN_API_KEY"]

[env]
api_key = "ELEVENLABS_API_KEY"
base_url = "ELEVENLABS_BASE_URL"

[verify]
method = "GET"
path = "/v1/user"

[[policies]]
id = "standard"
display = "Everything except deletes and account, key and billing changes"
recommended = true
allow = ["* /**"]
deny = ["DELETE /**", "* /v1/voices/add", "* /v1/voices/add/**", "* /v1/convai/twilio/outbound-call", "* /v1/convai/twilio/outbound-call/**", "* /v1/workspace/*", "* /v1/workspace/*/**", "* /v1/dubbing", "* /v1/dubbing/**"]

[[policies]]
id = "read-only"
display = "Read only"
allow = ["GET /**"]

[[policies]]
id = "full"
display = "Full access (not recommended for delegation)"
allow = ["* /**"]
