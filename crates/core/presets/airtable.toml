id = "airtable"
display = "Airtable"
category = "productivity"
upstreams = ["api.airtable.com"]
auth = { kind = "bearer" }
docs = "https://airtable.com/create/tokens"
base_path = "/v0"
key_prefixes = []
env_names = ["AIRTABLE_ACCESS_TOKEN", "AIRTABLE_TOKEN"]

[env]
api_key = "AIRTABLE_API_KEY"

[verify]
method = "GET"
path = "/v0/meta/whoami"

[[policies]]
id = "standard"
display = "Everything except deletes and account, key and billing changes"
recommended = true
allow = ["* /**"]
deny = ["DELETE /**", "DELETE /v0/*", "DELETE /v0/*/**", "* /v0/meta/bases/*/tables", "* /v0/meta/bases/*/tables/**", "PATCH /v0/meta/*", "PATCH /v0/meta/*/**"]

[[policies]]
id = "read-only"
display = "Read only"
allow = ["GET /**"]

[[policies]]
id = "full"
display = "Full access (not recommended for delegation)"
allow = ["* /**"]
