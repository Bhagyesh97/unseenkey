id = "alpha-vantage"
display = "Alpha Vantage"
category = "other"
upstreams = ["www.alphavantage.co"]
auth = { kind = "query", param = "apikey" }
docs = "https://www.alphavantage.co/support/#api-key"
base_path = "/query"
key_prefixes = []
env_names = ["ALPHAVANTAGE_API_KEY"]

[env]
api_key = "ALPHA_VANTAGE_API_KEY"

[verify]
method = "GET"
path = "/query?function=GLOBAL_QUOTE&symbol=IBM"

[[policies]]
id = "standard"
display = "Everything except deletes and account, key and billing changes"
recommended = true
allow = ["* /**"]
deny = ["DELETE /**"]

[[policies]]
id = "read-only"
display = "Read only"
allow = ["GET /**"]

[[policies]]
id = "full"
display = "Full access (not recommended for delegation)"
allow = ["* /**"]
