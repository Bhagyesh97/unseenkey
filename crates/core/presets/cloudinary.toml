id = "cloudinary"
display = "Cloudinary"
category = "hosting"
upstreams = ["api.cloudinary.com"]
auth = { kind = "basic", username_label = "API key", secret_label = "API secret" }
docs = "https://console.cloudinary.com/settings/api-keys"
base_path = "/v1_1"

[env]
api_key = "CLOUDINARY_API_SECRET"
username = "CLOUDINARY_API_KEY"

[[policies]]
id = "read-only"
display = "Read assets and usage only"
recommended = true
allow = ["GET /**"]

[[policies]]
id = "upload"
display = "Upload and read; no deletes"
recommended = true
allow = ["GET /**", "POST /v1_1/*/*/upload"]
deny = ["DELETE /**"]

[[policies]]
id = "full"
display = "Full access (not recommended for delegation)"
allow = ["* /**"]
