id = "google-ai"
display = "Google AI"
upstreams = ["generativelanguage.googleapis.com"]
auth = { kind = "query", param = "key" }
docs = "https://aistudio.google.com/app/apikey"
base_path = "/v1beta"
category = "ai"
key_prefixes = ["AIza"]

[env]
base_url = "GOOGLE_GEMINI_BASE_URL"
api_key = "GEMINI_API_KEY"


[verify]
method = "GET"
path = "/v1beta/models"

[[policies]]
id = "generate"
display = "Generate content and embeddings only"
recommended = true
allow = ["POST /v1beta/models/**", "GET /v1beta/models", "GET /v1beta/models/*", "POST /v1/models/**", "GET /v1/models"]
deny = ["* /v1beta/tunedModels/**", "* /v1beta/files/**"]

[[policies]]
id = "full"
display = "Full access (not recommended for delegation)"
allow = ["* /**"]

# Key-shaped handles for tools that check the key format (opt-in, D-26).

[[handle_formats]]
when = "AIza"
format = "AIzaSyusk{30}"
