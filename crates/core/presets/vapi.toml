id = "vapi"
display = "Vapi (voice AI agents)"
category = "messaging"
upstreams = ["api.vapi.ai"]
auth = { kind = "bearer" }
docs = "https://dashboard.vapi.ai/org/api-keys"
base_path = ""
key_prefixes = []
env_names = ["VAPI_PRIVATE_KEY", "VAPI_PUBLIC_KEY"]

[env]
api_key = "VAPI_API_KEY"

[verify]
method = "GET"
path = "/assistant?limit=1"

[[policies]]
id = "standard"
display = "Everything except deletes and account, key and billing changes"
recommended = true
allow = ["* /**"]
deny = ["DELETE /**", "POST /call", "POST /call/**", "POST /phone-number", "POST /phone-number/**", "* /campaign", "* /campaign/**"]

[[policies]]
id = "read-only"
display = "Read only"
allow = ["GET /**"]

[[policies]]
id = "full"
display = "Full access (not recommended for delegation)"
allow = ["* /**"]
