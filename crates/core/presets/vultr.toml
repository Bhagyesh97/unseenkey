id = "vultr"
display = "Vultr"
category = "hosting"
upstreams = ["api.vultr.com"]
auth = { kind = "bearer" }
docs = "https://my.vultr.com/settings/#settingsapi"
base_path = "/v2"
key_prefixes = []
env_names = []

[env]
api_key = "VULTR_API_KEY"

[verify]
method = "GET"
path = "/v2/account"

[[policies]]
id = "standard"
display = "Everything except deletes and account, key and billing changes"
recommended = true
allow = ["* /**"]
deny = ["DELETE /**", "* /v2/users/**", "* /v2/billing/**"]

[[policies]]
id = "read-only"
display = "Read only"
allow = ["GET /**"]

[[policies]]
id = "full"
display = "Full access (not recommended for delegation)"
allow = ["* /**"]
