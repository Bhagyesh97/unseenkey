id = "deepseek"
display = "DeepSeek"
category = "ai"
upstreams = ["api.deepseek.com"]
auth = { kind = "bearer" }
docs = "https://platform.deepseek.com/api_keys"
base_path = ""
key_prefixes = []
env_names = []

[env]
api_key = "DEEPSEEK_API_KEY"
base_url = "DEEPSEEK_BASE_URL"

[verify]
method = "GET"
path = "/user/balance"

[[policies]]
id = "standard"
display = "Everything except deletes and account, key and billing changes"
recommended = true
allow = ["* /**"]
deny = ["DELETE /**"]

[[policies]]
id = "read-only"
display = "Read only"
allow = ["GET /**"]

[[policies]]
id = "full"
display = "Full access (not recommended for delegation)"
allow = ["* /**"]
