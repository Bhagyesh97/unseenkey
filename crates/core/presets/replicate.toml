id = "replicate"
display = "Replicate"
category = "ai"
upstreams = ["api.replicate.com"]
auth = { kind = "bearer" }
docs = "https://replicate.com/account/api-tokens"
base_path = "/v1"
key_prefixes = ["r8_"]
env_names = ["REPLICATE_API_KEY"]

[env]
api_key = "REPLICATE_API_TOKEN"
base_url = "REPLICATE_BASE_URL"

[verify]
method = "GET"
path = "/v1/account"

[[policies]]
id = "standard"
display = "Everything except deletes and account, key and billing changes"
recommended = true
allow = ["* /**"]
deny = ["DELETE /**", "POST /v1/deployments", "POST /v1/deployments/**", "PATCH /v1/deployments/*", "PATCH /v1/deployments/*/**", "POST /v1/models", "POST /v1/models/**", "* /v1/trainings", "* /v1/trainings/**"]

[[policies]]
id = "read-only"
display = "Read only"
allow = ["GET /**"]

[[policies]]
id = "full"
display = "Full access (not recommended for delegation)"
allow = ["* /**"]
