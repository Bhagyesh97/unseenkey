id = "cohere"
display = "Cohere"
category = "ai"
upstreams = ["api.cohere.com", "api.cohere.ai"]
auth = { kind = "bearer" }
docs = "https://dashboard.cohere.com/api-keys"
base_path = "/v2"
key_prefixes = []
env_names = ["COHERE_API_KEY"]

[env]
api_key = "CO_API_KEY"
base_url = "CO_API_URL"

[verify]
method = "GET"
path = "/v1/models"

[[policies]]
id = "standard"
display = "Everything except deletes and account, key and billing changes"
recommended = true
allow = ["* /**"]
deny = ["DELETE /**", "* /v2/v1/finetuning/*", "* /v2/v1/finetuning/*/**", "* /v2/v1/datasets", "* /v2/v1/datasets/**", "* /v2/v1/connectors", "* /v2/v1/connectors/**", "* /v2/v1/embed-jobs", "* /v2/v1/embed-jobs/**"]

[[policies]]
id = "read-only"
display = "Read only"
allow = ["GET /**"]

[[policies]]
id = "full"
display = "Full access (not recommended for delegation)"
allow = ["* /**"]
