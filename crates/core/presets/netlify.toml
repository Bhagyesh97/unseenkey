id = "netlify"
display = "Netlify"
category = "hosting"
upstreams = ["api.netlify.com"]
auth = { kind = "bearer" }
docs = "https://app.netlify.com/user/applications#personal-access-tokens"
base_path = "/api/v1"
key_prefixes = []
env_names = []

[env]
api_key = "NETLIFY_AUTH_TOKEN"

[verify]
method = "GET"
path = "/api/v1/user"

[[policies]]
id = "standard"
display = "Everything except deletes and account, key and billing changes"
recommended = true
allow = ["* /**"]
deny = ["DELETE /**", "* /api/v1/accounts/*/env", "* /api/v1/accounts/*/env/**", "* /api/v1/accounts/*/members", "* /api/v1/accounts/*/members/**", "* /api/v1/hooks", "* /api/v1/hooks/**", "* /api/v1/dns_zones", "* /api/v1/dns_zones/**"]

[[policies]]
id = "read-only"
display = "Read only"
allow = ["GET /**"]

[[policies]]
id = "full"
display = "Full access (not recommended for delegation)"
allow = ["* /**"]
