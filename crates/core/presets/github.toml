id = "github"
display = "GitHub"
upstreams = ["api.github.com"]
auth = { kind = "bearer" }
docs = "https://github.com/settings/tokens"
base_path = ""
category = "devtools"
key_prefixes = ["github_pat_", "ghp_", "gho_", "ghu_", "ghs_", "ghr_"]

[env]
base_url = "GITHUB_API_URL"
api_key = "GITHUB_TOKEN"


[verify]
method = "GET"
path = "/user"
headers = { "Accept" = "application/vnd.github+json" }

[[policies]]
id = "read-only"
display = "Read repositories, issues and pull requests"
recommended = true
allow = ["GET /**"]
deny = ["GET /user/keys", "GET /user/emails", "GET /orgs/*/actions/secrets/**", "GET /repos/*/*/actions/secrets/**"]

[[policies]]
id = "contribute"
display = "Read, open issues and pull requests, push via API; no deletes or settings"
recommended = true
allow = [
  "GET /**",
  "POST /repos/*/*/issues",
  "PATCH /repos/*/*/issues/*",
  "POST /repos/*/*/issues/*/comments",
  "POST /repos/*/*/pulls",
  "PATCH /repos/*/*/pulls/*",
  "POST /repos/*/*/pulls/*/reviews",
  "POST /repos/*/*/pulls/*/comments",
  "POST /repos/*/*/git/**",
  "PUT /repos/*/*/contents/**",
  "POST /repos/*/*/statuses/*",
  "POST /repos/*/*/check-runs",
  "PATCH /repos/*/*/check-runs/*",
]
deny = [
  "DELETE /**",
  "* /repos/*/*/actions/secrets/**",
  "* /orgs/*/actions/secrets/**",
  "* /repos/*/*/keys/**",
  "* /user/keys/**",
  "* /repos/*/*/hooks/**",
  "* /orgs/*/hooks/**",
  "* /orgs/*/members/**",
  "* /repos/*/*/collaborators/**",
  "PATCH /repos/*/*",
]

[[policies]]
id = "full"
display = "Full access (not recommended for delegation)"
allow = ["* /**"]

# Key-shaped handles for tools that check the key format (opt-in, D-26).

[[handle_formats]]
when = "ghp_"
format = "ghp_usk{33}"

[[handle_formats]]
when = "github_pat_"
format = "github_pat_usk{40}"
