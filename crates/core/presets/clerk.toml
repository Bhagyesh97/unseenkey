id = "clerk"
display = "Clerk"
category = "auth"
upstreams = ["api.clerk.com"]
auth = { kind = "bearer" }
docs = "https://dashboard.clerk.com/last-active?path=api-keys"
base_path = "/v1"
key_prefixes = ["sk_live_", "sk_test_", "pk_live_", "pk_test_"]
env_names = ["NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY", "CLERK_PUBLISHABLE_KEY"]

[env]
api_key = "CLERK_SECRET_KEY"
base_url = "CLERK_API_URL"

[verify]
method = "GET"
path = "/v1/jwks"

[[policies]]
id = "standard"
display = "Everything except deletes and account, key and billing changes"
recommended = true
allow = ["* /**"]
deny = ["DELETE /**", "DELETE /v1/users/*", "DELETE /v1/users/*/**", "POST /v1/users/*/ban", "POST /v1/users/*/ban/**", "* /v1/users/*/metadata", "* /v1/users/*/metadata/**", "POST /v1/sign_in_tokens", "POST /v1/sign_in_tokens/**", "* /v1/actor_tokens", "* /v1/actor_tokens/**", "* /v1/instance", "* /v1/instance/**", "* /v1/jwt_templates", "* /v1/jwt_templates/**"]

[[policies]]
id = "read-only"
display = "Read only"
allow = ["GET /**"]

[[policies]]
id = "full"
display = "Full access (not recommended for delegation)"
allow = ["* /**"]
