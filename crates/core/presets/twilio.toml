id = "twilio"
display = "Twilio"
upstreams = ["api.twilio.com"]
auth = { kind = "basic", username_label = "Account SID or API key SID", secret_label = "Auth token or API key secret", username_like = ["AC*", "SK*"] }
docs = "https://console.twilio.com/"
base_path = "/2010-04-01"
category = "messaging"

[env]
api_key = "TWILIO_AUTH_TOKEN"
username = "TWILIO_ACCOUNT_SID"

[verify]
method = "GET"
path = "/2010-04-01/Accounts.json"

[[policies]]
id = "read-only"
display = "Read logs and resources only; not account tokens or API keys"
recommended = true
allow = ["GET /**"]
deny = ["* /2010-04-01/Accounts.json", "* /2010-04-01/Accounts/*.json", "* /2010-04-01/Accounts/*/Keys.json", "* /2010-04-01/Accounts/*/Keys/**"]

[[policies]]
id = "messaging"
display = "Send SMS and read logs; no calls, numbers or account changes"
recommended = true
allow = ["GET /**", "POST /2010-04-01/Accounts/*/Messages.json", "POST /2010-04-01/Accounts/*/Messages/*.json"]
deny = ["* /2010-04-01/Accounts.json", "* /2010-04-01/Accounts/*.json", "* /2010-04-01/Accounts/*/Calls.json", "* /2010-04-01/Accounts/*/Calls/**", "* /2010-04-01/Accounts/*/IncomingPhoneNumbers.json", "* /2010-04-01/Accounts/*/IncomingPhoneNumbers/**", "* /2010-04-01/Accounts/*/Keys.json", "* /2010-04-01/Accounts/*/Keys/**", "DELETE /**"]

[[policies]]
id = "full"
display = "Full access (not recommended for delegation)"
allow = ["* /**"]
