[package]
name = "unseenkey-core"
description = "Core library for Unseenkey: crypto, vault, policy, broker, audit. No sockets, no CLI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib"]

[features]
default = ["std", "sqlite"]
std = [
  "argon2/std",
  "hkdf/std",
  "blake3/std",
  "ed25519-dalek/std",
  "serde_json/std",
  "hex/std",
  "bip39/std",
]
# SQLite storage backend (native only).
sqlite = ["std", "dep:rusqlite"]
# Browser build (wasm32-unknown-unknown has std; the OS clock is not used
# there). Randomness comes from crypto.getRandomValues via getrandom's "js" feature.
wasm = ["std", "getrandom/js"]

[dependencies]
argon2 = { workspace = true }
chacha20poly1305 = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
blake3 = { workspace = true }
ed25519-dalek = { workspace = true }
rand_core = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true }
bip39 = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
getrandom = { version = "0.2", default-features = false }
rusqlite = { workspace = true, optional = true }
jiff = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
