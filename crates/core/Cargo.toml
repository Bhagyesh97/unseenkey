[package]
name = "unseenkey-core"
description = "Core library for Unseenkey: crypto, vault, policy, broker, audit. No sockets, no CLI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib"]

[features]
default = ["std"]
std = ["argon2/std", "hkdf/std", "blake3/std", "ed25519-dalek/std"]
# Browser build: no std-only platform code. Randomness comes from the
# browser's crypto.getRandomValues via getrandom's "js" feature.
wasm = ["getrandom/js"]

[dependencies]
argon2 = { workspace = true }
chacha20poly1305 = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
blake3 = { workspace = true }
ed25519-dalek = { workspace = true }
rand_core = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
getrandom = { version = "0.2", default-features = false }

[dev-dependencies]
serde_json = { workspace = true }
hex = { workspace = true }
