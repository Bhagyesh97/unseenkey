[package]
name = "unseenkey-daemon"
description = "Unseenkey local daemon: holds the unlocked vault and serves the loopback management API."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
unseenkey-core = { version = "0.1.0", path = "../core" }
axum = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
zeroize = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
percent-encoding = { workspace = true }
hex = { workspace = true, features = ["std"] }
base64 = { workspace = true }

# Session-lock and suspend notifications (see `platform.rs`, the crate's only `unsafe`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_RemoteDesktop",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = { workspace = true }
ureq = { workspace = true }
